# 로컬 학습용 실행 환경.
# MongoDB는 트랜잭션을 쓰기 위한 "단일 노드 replica set"이며 고가용성 구성이 아니다.
name: waitlist-takehome

services:
  mongo:
    image: mongo:8.0.38
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    # 호스트에 포트를 공개하지 않는다. 앱은 Compose 네트워크 안에서 접속한다.
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      # replica set이 초기화되고 쓰기 가능한 primary일 때만 healthy
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # replica set 초기화를 수행하고 종료하는 일회성 작업. 재실행해도 안전하다.
  mongo-init:
    image: mongo:8.0.38
    depends_on:
      mongo:
        condition: service_started
    environment:
      MONGO_REPLICA_SET_NAME: rs0
      MONGO_MEMBER_HOST: mongo:27017
    volumes:
      - ./deploy/mongo/init-replica-set.js:/init-replica-set.js:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          mongosh --host mongo --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1 && break
          sleep 1
        done
        exec mongosh --host mongo --quiet --file /init-replica-set.js
    restart: "no"

  app:
    build: .
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DATABASE: ${MONGODB_DATABASE:-waitlist}
      READINESS_TIMEOUT: ${READINESS_TIMEOUT:-2s}
      # 로컬은 HTTP이므로 false. HTTPS로 배포할 때는 true로 설정한다.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 식사 종료·좌석 반환 작업의 확인 간격
      SERVICE_END_INTERVAL: ${SERVICE_END_INTERVAL:-1s}
    ports:
      # 호스트의 127.0.0.1에만 공개한다.
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  # 개발 도구용 서비스 (profile 지정 시에만 사용, 기본 실행에는 포함되지 않음).
  # 소스는 읽기 전용으로 마운트한다.
  go:
    profiles: ["tools"]
    image: golang:1.27.4-alpine3.24
    working_dir: /src
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: "-buildvcs=false"
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
    volumes:
      - .:/src:ro
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

  # ---- E2E 전용 (profile e2e, scripts/e2e.sh가 사용) ----
  # 개발용 app과 분리된 앱 인스턴스. 임시 DB(E2E_DATABASE)를 쓰고 호스트에 포트를 공개하지 않는다.
  app-e2e:
    profiles: ["e2e"]
    build: .
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DATABASE: ${E2E_DATABASE:-e2e_default}
      COOKIE_SECURE: "false"
      SERVICE_END_INTERVAL: 1s

  # Playwright 실행기. 공식 이미지(브라우저 포함)와 같은 버전의 @playwright/test를 e2e/package.json에 고정한다.
  playwright:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    working_dir: /e2e
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    init: true
    ipc: host
    depends_on:
      - app-e2e
    environment:
      HOME: /tmp
      CI: "1"
      BASE_URL: http://app-e2e:8080
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      E2E_DATABASE: ${E2E_DATABASE:-e2e_default}
    volumes:
      - ./e2e:/e2e

volumes:
  mongo-data:
  mongo-config:
  go-mod-cache:
  go-build-cache:
